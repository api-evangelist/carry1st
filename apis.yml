aid: carry1st
name: Carry1st
description: >-
  Carry1st is Africa's leading mobile games publisher and digital commerce
  platform, headquartered in South Africa and operating across high-growth
  African markets including Nigeria, South Africa, Kenya, Ghana, Egypt, and
  Morocco. Beyond publishing and distributing mobile games from partners such as
  Riot Games, Activision, and Supercell, Carry1st operates Pay1st, a payment
  gateway that lets digital-content and game developers accept payments through
  120+ local payment methods across six African geographies. Pay1st offers a
  single unified API, acts as Merchant of Record (handling compliance, taxation,
  FX, and risk so businesses collect in USD), and supports hosted-payment,
  game-client, and Carry1st Shop marketplace integration styles. Carry1st is
  backed by a16z. This profile was enriched by the API Evangelist pipeline from
  the public Pay1st developer documentation.
