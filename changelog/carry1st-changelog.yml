- version: v4.0
  breaking: true
  highlights:
  - Major version of the Pay1st Gateway integration with breaking changes vs v3.x.
  - Existing Pay1st Users migrate to Partner Users; Administrator and Read-Only roles carried over.
  - Product and Product Bundles are no longer managed server-side; products are specified inline on Create Payment Request.
  - Summary Webhooks replaced by Payment Webhook Events; externalReference to partnerReference, playerId to customerId, amount to orderAmount (no longer in cents).
  - Old Basic Auth Token/Username/Password credentials are shredded and replaced by API Key/Secret + Signing Key.
  - Both old and new integrations can run in parallel until the old one is decommissioned.
